<!-- ================= Age gate ================= -->
<div id="age-gate" class="screen active">

    <h1>KAWAYODO</h1>
    <p class="gate-subtitle" id="gate-subtitle"></p>
    <div class="lang-bar" id="lang-bar-gate"></div>

    </div>
  </div>
</div>

<!-- ================= Menu screen ================= -->
<div id="menu-screen" class="screen">

  <main id="menu-list"></main>
  <div class="cart-bar">
    <button id="view-order-btn"><span id="view-order-label"></span> (<span id="cart-count">0</span>)</button>
  </div>
</div>

<!-- ================= Order (customer) screen ================= -->
<div id="order-screen" class="screen">

    <div class="lang-bar" id="lang-bar-order"></div>
  </header>
  <div id="order-list"></div>
  <div class="order-actions">
    <button id="show-staff-btn" class="btn btn-primary"></button>
  </div>
</div>

<!-- ================= Staff screen ================= -->

const NON_ALCOHOL_CATEGORY = "soft";

/* ============================================================
   State
   ============================================================ */
let ageConfirmed = sessionStorage.getItem("kawayodo_age_confirmed");
let currentLang = sessionStorage.getItem("kawayodo_lang") || "en";
// itemState[id] = { qty: number, bottles: number, glasses: number, styleIndex: number|null }
const itemState = {};
DRINKS.forEach(d => { itemState[d.id] = { qty: 0, bottles: 0, glasses: 0, styleIndex: d.servingStyles.length ? 0 : null }; });

function isReady(d, st) {
  return d.requiresGlassCount ? (st.bottles >= 1 && st.glasses >= 1) : st.qty >= 1;
}

// cart: array of { key, id, name, price, qty, bottles, glasses, vesselType, style }
let cart = [];

/* ============================================================
   Helpers
   ============================================================ */
function yen(n) { return "¥" + n.toLocaleString("en-US"); }

function visibleDrinks() {
  if (ageConfirmed === "no") {
    return DRINKS.filter(d => d.category === NON_ALCOHOL_CATEGORY);
  }
  return DRINKS;
}

function categoriesInOrder(drinks) {
  const seen = [];
  drinks.forEach(d => { if (!seen.includes(d.category)) seen.push(d.category); });
  return seen;
}

function cartKey(id, bottles, glasses, styleJa) {
  return id + "|" + bottles + "|" + glasses + "|" + (styleJa || "");
}

function totalCartCount() {
  return cart.reduce((sum, item) => sum + item.qty, 0);
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  window.scrollTo(0, 0);
}

/* ============================================================
   Rendering: language switcher
   ============================================================ */
function renderLangBars() {
  const html = LANGUAGES.map(l =>
    `<button type="button" class="lang-btn${l.code === currentLang ? " active" : ""}" data-lang="${l.code}">${l.label}</button>`
  ).join("");
  ["lang-bar-gate", "lang-bar-menu", "lang-bar-order"].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = html;
    el.querySelectorAll(".lang-btn").forEach(btn => {
      btn.addEventListener("click", () => setLang(btn.dataset.lang));
    });
  });
}

function setLang(lang) {
  if (lang === currentLang) return;
  currentLang = lang;
  sessionStorage.setItem("kawayodo_lang", lang);
  renderLangBars();
  renderAgeGate();
  if (ageConfirmed === "yes" || ageConfirmed === "no") {
    renderMenu();
  }
  renderOrder();
}

/* ============================================================
   Rendering: age gate
   ============================================================ */
function renderAgeGate() {
  const t = UI_TEXT[currentLang];
  document.getElementById("gate-subtitle").textContent = t.headerSubtitle;
  document.getElementById("age-question").textContent = t.ageQuestion;
  document.getElementById("age-yes").textContent = t.yes;
  document.getElementById("age-no").textContent = t.no;
}

/* ============================================================
   Rendering: menu
   ============================================================ */
function renderMenu() {
  const drinks = visibleDrinks();
  const catKeys = categoriesInOrder(drinks);
  const t = UI_TEXT[currentLang];

  document.getElementById("header-subtitle").textContent = t.headerSubtitle;
  document.getElementById("view-order-label").textContent = t.viewOrder;

  const nav = document.getElementById("category-nav");
  nav.innerHTML = catKeys.map((key, i) =>
    `<button data-cat="cat-${i}">${CATEGORIES[key][currentLang]}</button>`
  ).join("");
  nav.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.getElementById(btn.dataset.cat).scrollIntoView({ behavior: "smooth" });
    });
  });

  const list = document.getElementById("menu-list");
  list.innerHTML = catKeys.map((key, i) => {
    const items = drinks.filter(d => d.category === key);
    return `
      <section class="category-section" id="cat-${i}">
        <div class="category-bar">${CATEGORIES[key][currentLang]}</div>
        ${items.map(renderDrinkCard).join("")}
      </section>
    `;
  }).join("");

  list.querySelectorAll(".drink-card").forEach(card => {
    const id = card.dataset.id;
    const drink = DRINKS.find(d => d.id === id);
    const addBtn = card.querySelector(".add-btn");

    function refreshAddBtn() {
      const ready = isReady(drink, itemState[id]);
      addBtn.classList.toggle("ready", ready);
      addBtn.disabled = !ready;
    }

    const containerMinus = card.querySelector(".container-minus");
    const containerPlus = card.querySelector(".container-plus");
    const containerVal = card.querySelector(".container-value");
    if (containerMinus) {
      containerMinus.addEventListener("click", () => {
        const st = itemState[id];
        st.bottles = Math.max(0, st.bottles - 1);
        containerVal.textContent = st.bottles;
        refreshAddBtn();
      });
      containerPlus.addEventListener("click", () => {
        const st = itemState[id];
        st.bottles = Math.min(10, st.bottles + 1);
        containerVal.textContent = st.bottles;
        refreshAddBtn();
      });
    }

    const glassMinus = card.querySelector(".glass-minus");
    const glassPlus = card.querySelector(".glass-plus");
    const glassVal = card.querySelector(".glass-value");
    if (glassMinus) {
      glassMinus.addEventListener("click", () => {
        const st = itemState[id];
        st.glasses = Math.max(0, st.glasses - 1);
        glassVal.textContent = st.glasses;
        refreshAddBtn();
      });
      glassPlus.addEventListener("click", () => {
        const st = itemState[id];
        st.glasses = Math.min(20, st.glasses + 1);
        glassVal.textContent = st.glasses;
        refreshAddBtn();
      });
    }

    const qtyMinus = card.querySelector(".count-minus");
    const qtyPlus = card.querySelector(".count-plus");
    const qtyVal = card.querySelector(".count-value");
    if (qtyMinus) {
      qtyMinus.addEventListener("click", () => {
        const st = itemState[id];
        st.qty = Math.max(0, st.qty - 1);
        qtyVal.textContent = st.qty;
        refreshAddBtn();
      });
      qtyPlus.addEventListener("click", () => {
        const st = itemState[id];
        st.qty = Math.min(20, st.qty + 1);
        qtyVal.textContent = st.qty;
        refreshAddBtn();
      });
    }

    card.querySelectorAll(".style-option").forEach(opt => {
      opt.addEventListener("click", () => {
        itemState[id].styleIndex = Number(opt.dataset.idx);
        card.querySelectorAll(".style-option").forEach(o => o.classList.remove("selected"));
        opt.classList.add("selected");
      });
    });

    addBtn.addEventListener("click", () => {
      addToCart(drink, addBtn);
      const st = itemState[id];
      st.qty = 0; st.bottles = 0; st.glasses = 0;
      if (containerVal) containerVal.textContent = 0;
      if (glassVal) glassVal.textContent = 0;
      if (qtyVal) qtyVal.textContent = 0;
      refreshAddBtn();
    });
  });

  updateCartCount();
  renderAgeNote();
}

function renderDrinkCard(d) {
  const st = itemState[d.id];
  const t = UI_TEXT[currentLang];
  let optionsHtml = "";

  if (d.requiresGlassCount) {
    const labels = VESSEL_LABELS[d.vesselType];
    optionsHtml += `
      <div class="option-row">
        <span class="option-label">${labels.containerLabel[currentLang]}</span>
        <div class="stepper">
          <button type="button" class="container-minus">−</button>
          <span class="container-value">${st.bottles}</span>
          <button type="button" class="container-plus">＋</button>
        </div>
      </div>
      <div class="option-row">
        <span class="option-label">${labels.glassLabel[currentLang]}</span>
        <div class="stepper">
          <button type="button" class="glass-minus">−</button>
          <span class="glass-value">${st.glasses}</span>
          <button type="button" class="glass-plus">＋</button>
        </div>
      </div>`;
  } else {
    optionsHtml += `
      <div class="option-row">
        <span class="option-label">${t.quantity}</span>
        <div class="stepper">
          <button type="button" class="count-minus">−</button>
          <span class="count-value">${st.qty}</span>
          <button type="button" class="count-plus">＋</button>
        </div>
      </div>`;
  }

  if (d.servingStyles.length) {
    optionsHtml += `
      <div class="option-row">
        <span class="option-label">${t.servingStyle}</span>
        <div class="style-options">
          ${d.servingStyles.map((s, i) =>
            `<button type="button" class="style-option${i === st.styleIndex ? " selected" : ""}" data-idx="${i}">${s[currentLang]}</button>`
          ).join("")}
        </div>
      </div>`;
  }

  const ready = isReady(d, st);
  const desc = d.desc[currentLang];
  return `
    <div class="drink-card" data-id="${d.id}">
      <div class="drink-name-en">${d.name[currentLang]}</div>
      ${desc ? `<div class="drink-desc">${desc}</div>` : ""}
      <div class="drink-price">${yen(d.price)}</div>
      ${optionsHtml ? `<div class="drink-options">${optionsHtml}</div>` : ""}
      <button type="button" class="add-btn${ready ? " ready" : ""}"${ready ? "" : " disabled"}>${t.addToOrder}</button>
    </div>
  `;
}

function renderAgeNote() {
  const note = document.getElementById("age-note");
  note.textContent = ageConfirmed === "no" ? UI_TEXT[currentLang].softDrinksOnly : "";
}

/* ============================================================
   Cart operations
   ============================================================ */
function addToCart(drink, btn) {
  const st = itemState[drink.id];
  if (!isReady(drink, st)) return;
  const t = UI_TEXT[currentLang];

  const style = st.styleIndex !== null ? drink.servingStyles[st.styleIndex] : null;
  const bottles = drink.requiresGlassCount ? st.bottles : null;
  const glasses = drink.requiresGlassCount ? st.glasses : null;
  const addedQty = drink.requiresGlassCount ? 1 : st.qty;
  const key = cartKey(drink.id, bottles, glasses, style ? style.ja : null);

  const existing = cart.find(item => item.key === key);
  if (existing) {
    existing.qty += addedQty;
  } else {
    cart.push({
      key, id: drink.id,
      name: drink.name,
      slipName: drink.slipName,
      price: drink.price, qty: addedQty,
      bottles, glasses, vesselType: drink.vesselType,
      style
    });
  }

  updateCartCount();

  const original = btn.textContent;
  btn.textContent = t.added;
  btn.classList.add("added");
  setTimeout(() => { btn.textContent = original; btn.classList.remove("added"); }, 900);
}

function updateCartCount() {
  document.getElementById("cart-count").textContent = totalCartCount();
}

function changeQty(key, delta) {
  const item = cart.find(i => i.key === key);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.key !== key);
  }
  renderOrder();
  updateCartCount();
}

function removeItem(key) {
  cart = cart.filter(i => i.key !== key);
  renderOrder();
  updateCartCount();
}

/* ============================================================
   Rendering: order (customer) screen
   ============================================================ */
function renderOrder() {
  const list = document.getElementById("order-list");
  const showStaffBtn = document.getElementById("show-staff-btn");
  const heading = document.getElementById("order-heading");
  const backBtn = document.getElementById("order-back-btn");
  const t = UI_TEXT[currentLang];

  heading.textContent = t.yourOrder;
  backBtn.textContent = "← " + t.back;
  showStaffBtn.textContent = t.showToStaff;

  if (cart.length === 0) {
    list.innerHTML = `<p class="empty-note">${t.emptyOrder}</p>`;
    showStaffBtn.disabled = true;
    return;
  }
  showStaffBtn.disabled = false;

  list.innerHTML = cart.map(item => {
    const opts = [];
    if (item.bottles) {
      const labels = VESSEL_LABELS[item.vesselType];
      opts.push(formatVesselCount(item.bottles, labels.containerUnit, currentLang));
    }
    if (item.glasses) {
      const labels = VESSEL_LABELS[item.vesselType];
      opts.push(formatVesselCount(item.glasses, labels.glassUnit, currentLang));
    }
    if (item.style) opts.push(item.style[currentLang]);
    return `
      <div class="order-item" data-key="${item.key}">
        <div class="order-item-main">
          <div class="en">${item.name[currentLang]}</div>
          ${opts.length ? `<div class="options">${opts.join(" · ")}</div>` : ""}
        </div>
        <div class="qty-control">
          <button type="button" class="qty-minus">−</button>
          <span>${item.qty}</span>
          <button type="button" class="qty-plus">＋</button>
          <button type="button" class="remove-btn">✕</button>
        </div>
      </div>
    `;
  }).join("");

  list.querySelectorAll(".order-item").forEach(row => {
    const key = row.dataset.key;
    row.querySelector(".qty-minus").addEventListener("click", () => changeQty(key, -1));
    row.querySelector(".qty-plus").addEventListener("click", () => changeQty(key, 1));
    row.querySelector(".remove-btn").addEventListener("click", () => removeItem(key));
  });
}

/* ============================================================
   Rendering: staff screen (always Japanese, no prices — unaffected by language switch)
   ============================================================ */
function renderStaff() {
  const t = UI_TEXT[currentLang];
  document.getElementById("staff-back-btn").textContent = "← " + t.back;
  document.getElementById("staff-heading").textContent = t.yourOrder;

  const list = document.getElementById("staff-list");
  if (cart.length === 0) {
    list.innerHTML = `<p class="empty-note">${t.emptyOrder}</p>`;
    return;
  }
  const staffNoteJa = "この画面をスタッフにお見せください";
  const staffNote = currentLang === "ja" ? staffNoteJa : `${t.showToStaffNote} / ${staffNoteJa}`;
  list.innerHTML = cart.map(item => {
    const opts = [];
    if (item.bottles) {
      const labels = VESSEL_LABELS[item.vesselType];
      const containerName = item.vesselType === "tokkuri" ? "徳利" : "本数";
      opts.push(`${containerName}：${item.bottles}${labels.containerUnit.ja}`);
    }
    if (item.glasses) {
      const labels = VESSEL_LABELS[item.vesselType];
      const glassName = item.vesselType === "tokkuri" ? "お猪口" : "グラス数";
      opts.push(`${glassName}：${item.glasses}${labels.glassUnit.ja}`);
    }
    if (item.style) opts.push(`飲み方：${item.style.ja}`);
    return `
      <div class="staff-item">
        <div class="staff-name">${item.slipName} × ${item.qty}</div>
        ${opts.length ? `<div class="staff-options">${opts.join(" / ")}</div>` : ""}
      </div>
    `;
  }).join("") + `<p class="staff-note">${staffNote}</p>`;
}

/* ============================================================
   Wiring
   ============================================================ */
document.getElementById("age-yes").addEventListener("click", () => {
  ageConfirmed = "yes";
  sessionStorage.setItem("kawayodo_age_confirmed", "yes");
  renderMenu();
  showScreen("menu-screen");
});

document.getElementById("age-no").addEventListener("click", () => {
  ageConfirmed = "no";
  sessionStorage.setItem("kawayodo_age_confirmed", "no");
  renderMenu();
  showScreen("menu-screen");
});

document.getElementById("view-order-btn").addEventListener("click", () => {
  renderOrder();
  showScreen("order-screen");
});

document.getElementById("order-back-btn").addEventListener("click", () => {
  showScreen("menu-screen");
});

document.getElementById("show-staff-btn").addEventListener("click", () => {
  if (cart.length === 0) return;
  renderStaff();
  showScreen("staff-screen");
});

document.getElementById("staff-back-btn").addEventListener("click", () => {
  showScreen("order-screen");
});

/* ============================================================
   Init
   ============================================================ */
renderLangBars();
renderAgeGate();
renderOrder();
if (ageConfirmed === "yes" || ageConfirmed === "no") {
  renderMenu();
  showScreen("menu-screen");
} else {
  showScreen("age-gate");
}
</script>
